# Demoni posle builda ostaju da žive sa punim hipom. Projekat je mali (APK je
# 1,7 MB), pa im toliko memorije ne treba, a sat vremena kasnije i dalje drže
# gigabajte. Zato niži hip i kraći rok mirovanja: posle 30 minuta se sami gase.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
org.gradle.daemon.idletimeout=1800000
kotlin.daemon.jvmargs=-Xmx1024m

android.useAndroidX=true
kotlin.code.style=official
